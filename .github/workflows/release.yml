# Checks every push, and publishes a release when a v* tag is pushed (or "Run workflow"):
#   borders-linux-x86_64.zip, borders-windows-x86_64.zip   addon.toml, the program, README, LICENSE
#   borders-macos-aarch64.zip, borders-macos-x86_64.zip    Apple Silicon and Intel Macs
# Each file signed with Cut Craft's release key (FILE.minisig beside it), so Gadgets >
# Add-ons installs it as official. Needs the secrets MINISIGN_SECRET_KEY and
# MINISIGN_PASSWORD (the same key as Cut Craft's own releases). No Google key is ever
# needed here: each person types their own into Cut Craft.
name: Borders add-on

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the program runnable on older glibc distributions
          - os: ubuntu-22.04
            name: linux-x86_64
            exe: cutcraft-borders
          - os: windows-latest
            name: windows-x86_64
            exe: cutcraft-borders.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Zip
        shell: bash
        run: |
          mkdir -p out pack
          cp addon.toml README.md LICENSE "target/release/${{ matrix.exe }}" pack/
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd pack && 7z a -tzip "../out/borders-${{ matrix.name }}.zip" .)
          else
            (cd pack && zip -r "../out/borders-${{ matrix.name }}.zip" .)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: borders-${{ matrix.name }}
          path: out/*

  # Macs on their own, so a cancelled macOS job never holds back Linux and Windows. Run the
  # workflow again later and publish adds the Mac zips to the same release.
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build and zip
        run: |
          mkdir -p out
          for arch in aarch64 x86_64; do
            cargo build --release --target "$arch-apple-darwin"
            rm -rf pack && mkdir pack
            cp addon.toml README.md LICENSE "target/$arch-apple-darwin/release/cutcraft-borders" pack/
            (cd pack && zip -r "../out/borders-macos-$arch.zip" .)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: borders-macos
          path: out/*

  publish:
    if: always() && needs.build.result == 'success'
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          REQUIRE_SIGNING: '1'
        run: scripts/sign-release out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' addon.toml)
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" out/* --clobber
          else
            gh release create "v$version" out/* --title "Borders add-on $version" \
              --notes "Generates repeating picture-frame borders for Cut Craft's Generate Border tool. Install it from Cut Craft: Gadgets > Add-ons."
          fi
      - name: Say when the Mac zip is missing
        if: needs.build-macos.result != 'success'
        run: echo "::warning::The Mac build did not finish (${{ needs.build-macos.result }}), so this release has no Mac zips yet. Run the workflow again to add them."
