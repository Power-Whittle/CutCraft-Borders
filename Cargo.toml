[package]
name = "cutcraft-borders"
description = "Borders add-on for Cut Craft: asks Google's image model for a repeating length of moulding and then its depth map. Cut Craft runs it behind its Generate Border form"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
publish = false

[[bin]]
name = "cutcraft-borders"
path = "src/main.rs"

[dependencies]
base64 = "0.21"
serde_json = "1"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
strip = true
lto = "thin"
